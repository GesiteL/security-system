spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/security_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: tftc.lch.security.domain
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true

jwt:
  secret: ${JWT_SECRET:}
  expire-ms: ${JWT_EXPIRE_MS:28800000}

server:
  port: 8080
